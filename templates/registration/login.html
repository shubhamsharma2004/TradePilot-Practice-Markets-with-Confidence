<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paper Trade — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #ff830f;
      --orange-dark: #e67000;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f1f5f9;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .brand {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .brand em { color: var(--orange); font-style: normal; }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .error-list {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #dc2626;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #f8fafc;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 18px;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--orange);
      background: #fff;
    }
    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button[type="submit"]:hover { background: var(--orange-dark); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Findoc <em>Paper Trade</em></div>
    <div class="subtitle">Sign in to your account</div>

    {% if form.errors %}
    <div class="error-list">Invalid username or password. Please try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" id="id_username" name="username" autofocus autocomplete="username">

      <label for="id_password">Password</label>
      <input type="password" id="id_password" name="password" autocomplete="current-password">

      {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
